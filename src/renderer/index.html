<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="titlebar">
        <div class="titlebar-actions no-drag">
          <button id="pinToggle" class="ghost-button">置顶</button>
          <button id="settingsToggle" class="ghost-button">设置</button>
          <button id="minimizeButton" class="ghost-button">最小化</button>
          <button id="closeButton" class="ghost-button danger">关闭</button>
        </div>
      </header>

      <main id="contentShell" class="content content-collapsed">
        <section class="subtitle-stage">
          <div id="subtitleList" class="subtitle-list">
            <article class="subtitle-card">
              <p class="original-line">Press start to listen.</p>
              <p class="translated-line">点击开始后，软件会自动识别中文或英文并翻译。</p>
            </article>
          </div>
        </section>

        <aside id="settingsPanel" class="settings-panel hidden">
          <div class="settings-group">
            <label for="audioSourceSelect">音频来源</label>
            <select id="audioSourceSelect">
              <option value="microphone">麦克风</option>
              <option value="system">系统声音（浏览器/播放器/本机软件）</option>
            </select>
          </div>

          <div class="settings-group">
            <label for="backendModeSelect">识别模式</label>
            <select id="backendModeSelect">
              <option value="local">本地模型（Whisper + Argos）</option>
              <option value="mimo">MiMo-V2-Omni 云端模式</option>
            </select>
          </div>

          <div class="settings-group">
            <label for="pythonPathInput">Python 路径</label>
            <input
              id="pythonPathInput"
              type="text"
              placeholder="python"
              autocomplete="off"
            />
          </div>

          <div class="settings-group">
            <label for="whisperModelInput">Whisper 模型</label>
            <input
              id="whisperModelInput"
              type="text"
              placeholder="medium"
              autocomplete="off"
            />
          </div>

          <div class="settings-group">
            <label for="apiBaseUrlInput">MiMo API 地址</label>
            <input
              id="apiBaseUrlInput"
              type="text"
              placeholder="https://api.xiaomimimo.com/v1"
              autocomplete="off"
            />
          </div>

          <div class="settings-group">
            <label for="cloudModelInput">MiMo 模型名</label>
            <input
              id="cloudModelInput"
              type="text"
              placeholder="mimo-v2-omni"
              autocomplete="off"
            />
          </div>

          <div class="settings-group">
            <label for="mimoApiKeyInput">MiMo API Key</label>
            <input
              id="mimoApiKeyInput"
              type="password"
              placeholder="请输入你的 MiMo API Key"
              autocomplete="off"
            />
          </div>

          <div class="settings-group inline-group">
            <label for="showOriginalToggle">显示原文</label>
            <input id="showOriginalToggle" type="checkbox" checked />
          </div>

          <div class="settings-group">
            <label for="fontScaleRange">字幕大小</label>
            <input id="fontScaleRange" type="range" min="0.85" max="1.35" step="0.05" />
          </div>

          <div class="settings-group">
            <label for="opacityRange">窗口透明度</label>
            <input id="opacityRange" type="range" min="0.7" max="1" step="0.02" />
          </div>

          <div class="settings-group">
            <label for="chunkRange">识别节奏</label>
            <input id="chunkRange" type="range" min="2000" max="8000" step="400" />
            <small id="chunkHint"></small>
          </div>

          <div class="settings-group muted-copy">
            <p>本地模式适合离线使用，不需要 API Key。</p>
            <p>MiMo 模式会把音频片段发给云端模型，一次返回原文和翻译，适合直接测试全模态能力。</p>
          </div>
        </aside>
      </main>

      <footer class="control-bar no-drag">
        <div class="left-controls">
          <button id="startButton" class="primary-button">开始监听</button>
          <button id="stopButton" class="ghost-button" disabled>停止</button>
        </div>
        <div class="status-wrap">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText">准备就绪</span>
        </div>
      </footer>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
